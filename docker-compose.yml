services:
  db:
    image: postgres:16
    container_name: aihas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: aihas-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "${CHROMA_PORT}:8000"
    volumes:
      - ./chroma_data:/chroma/chroma

  backend:
    build: ./backend
    container_name: aihas-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      WATCHFILES_FORCE_POLLING: "true"
      MOCK_JIRA_URL: http://mock-jira:8010
      N8N_WEBHOOK_URL: http://mock-jira:8010/hooks/aihas
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend:/app
      - ./knowledge_base:/knowledge_base:ro
      - ./tests:/app/tests
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_started

  mock-jira:
    build: ./automation/mock_jira
    container_name: aihas-mock-jira
    restart: unless-stopped
    ports:
      - "8010:8010"
      
  frontend:
    build: ./frontend
    container_name: aihas-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend